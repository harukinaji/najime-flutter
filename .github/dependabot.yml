# Dependabot keeps compatible dependencies current and opens security-aware
# PRs without flooding the repo with breaking changes.
#
# Policy:
#   - semver-MAJOR bumps are NOT proposed automatically for either pub or
#     GitHub Actions: they require manual API migration and their PRs break
#     CI compilation. Bump majors by hand when you intend to migrate.
#   - minor/patch updates (and patch-only for actions) are grouped to keep
#     the PR list small.
#
# Also enable in the repo (Settings -> Code security):
#   - Secret scanning (incl. push protection)
#   - Dependabot alerts / security updates

version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
    groups:
      compatible-updates:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - ci
      - dependencies
    groups:
      actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major